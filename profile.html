<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="home.css">
  <link rel="stylesheet" href="profile.css">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="theme-color" content="#0f172a">
  <title>ユーザープロフィール</title>
</head>
<body>
  <div id="header-area"></div>

  <main class="home-container">
    <section class="profile-app">
      <h1>プロフィール設定</h1>

      <div class="input-group">
        <label for="nickname-input">ニックネーム</label>
        <input type="text" id="nickname-input">
      </div>

      <div class="input-group">
        <label for="gender-input">性別</label>
        <select id="gender-input">
          <option value="">選択してください</option>
          <option value="male">男性</option>
          <option value="female">女性</option>
          <option value="other">その他</option>
        </select>
      </div>

      <div class="input-group">
        <label for="age-input">年齢（歳）</label>
        <input type="number" id="age-input" min="0" max="120" placeholder="30">
      </div>

      <div class="input-group">
        <label for="height-input">身長（cm）</label>
        <input type="number" id="height-input" min="0" step="any" placeholder="170.0">
      </div>

      <div class="input-group">
        <label for="weight-input">体重（kg）</label>
        <input type="number" id="weight-input" min="0" step="any" placeholder="60.0">
      </div>

      <button id="save-profile-btn">プロフィールを保存</button>

      <div class="nav-links">
        <a href="timer.html" target="_blank" rel="noopener noreferrer">ランニング計測へ</a>
        <a href="simulation.html" target="_blank" rel="noopener noreferrer">シミュレーターへ</a>
      </div>
    </section>
  </main>

  <script src="profile.js"></script>
  <script src="header.js"></script>
</body>
</html>
