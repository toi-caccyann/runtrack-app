<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="home.css">
  <link rel="stylesheet" href="simulation.css">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="theme-color" content="#0f172a">
  <title>シミュレーション</title>
</head>
<body>
  <div id="header-area"></div>

  <main class="home-container">
    <section class="input-app">
      <h1>カロリーシミュレーター</h1>

      <div class="input-group">
        <label for="weight-input">体重（kg）</label>
        <input type="number" id="weight-input" min="0" placeholder="60">
      </div>

      <div class="input-group">
        <label for="distance-input">走った距離（km）</label>
        <input type="number" id="distance-input" min="0" step="any" placeholder="5.0">
      </div>

      <div class="input-group">
        <label for="runtime-input">走った時間（分）</label>
        <input type="number" id="runtime-input" min="0" placeholder="30">
      </div>

      <button id="simulation">シミュレーションする</button>
    </section>

    <section class="result-card">
      <span class="result-label">今回の消費カロリー</span>
      <span class="result-value" id="calorie-result">0kcal</span>
    </section>
  </main>

  <script src="calorie-calc.js"></script>
  <script src="simulation.js"></script>
  <script src="header.js"></script>
</body>
</html>
