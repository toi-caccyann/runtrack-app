<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="home.css">
  <link rel="stylesheet" href="simulation.css">
  <title>シミュレーション</title>
</head>
<body>
  <div id="header-area"></div>

  <div class="input-app">
    <h1>入力</h1>
    
    <label class="weight-input">体重（kg）</label>
    <div class="input-label">
      <input type="number" id="weight-input" min="0" placeholder="60">
    </div>
    
    <label class="distance-input">走った距離（km）</label>
    <div class="input-label">
      <input type="number" id="distance-input" min="0" step="any" placeholder="5.0">
    </div>
    
    <label class="runtime-input">走った時間（分）</label>
    <div class="input-label">
      <input type="number" id="runtime-input" min="0" placeholder="30">
    </div>

  </div>

<button id="simulation">シミュレーションする</button>

  <div class="result-container">
    <p>今回の消費カロリー:<span id="calorie-result">0kcal</span></p>
  </div>
  
  <script src="calorie-calc.js"></script>
  <script src="simulation.js"></script>
  <script src="header.js"></script>
</body>
</html>
